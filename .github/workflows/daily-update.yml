name: Daily wine data update

on:
  schedule:
    # Every day at 06:00 UTC (08:00 Swedish time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests rapidfuzz google-auth google-api-python-client

      - name: Set up Node.js (for Babel)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: |
          cd $GITHUB_WORKSPACE
          npm install --save-dev @babel/cli @babel/core @babel/preset-react

      - name: Create data directories
        run: |
          mkdir -p data/history data/logs

      - name: Download existing data (if cached)
        uses: actions/cache@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
          key: wine-data-${{ github.run_number }}
          restore-keys: |
            wine-data-

      - name: Fetch Systembolaget data
        run: |
          python3 scripts/fetch_systembolaget.py

      - name: Score wines
        run: |
          python3 scripts/score_wines_v2.py

      - name: Build site
        run: |
          python3 scripts/build_slim.py
          python3 scripts/deploy_html.py

      - name: Generate landing pages + price drops
        run: |
          # Only regenerate pages that have shipped in a batch
          ALLOWLIST=$(python3 -c "import json,os; f='data/deploy/shipped_pages.json'; print(','.join(json.load(open(f))) if os.path.exists(f) else '')")
          if [ -n "$ALLOWLIST" ]; then
            DEPLOY_PAGES="$ALLOWLIST" python3 scripts/generate_landing_pages.py
          else
            echo "No shipped pages — skipping landing page generation"
          fi
          python3 scripts/generate_monthly_seo.py
          python3 scripts/generate_prissankt.py

      - name: Validate data
        run: |
          python3 scripts/validate_data.py

      - name: Fetch GSC data
        env:
          GSC_CREDS: ${{ secrets.GSC_CREDENTIALS_JSON }}
        if: env.GSC_CREDS != ''
        run: |
          echo "$GSC_CREDS" > /tmp/gsc_creds.json
          GSC_CREDENTIALS_JSON=/tmp/gsc_creds.json python3 scripts/fetch_gsc.py
          rm -f /tmp/gsc_creds.json

      - name: Build admin data
        run: |
          python3 scripts/build_admin.py

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
          key: wine-data-${{ github.run_number }}

      - name: Commit and push
        run: |
          git config user.name "Smakfynd Bot"
          git config user.email "bot@smakfynd.se"
          git add docs/ site/ data/history/ data/prissankt_bootstrap.json data/gsc_history.json data/page_hashes.json

          # Manifest check: only allow known-safe files to be committed
          # Shipped landing pages come from shipped_pages.json
          SHIPPED=$(python3 -c "
          import json, os, glob
          f = 'data/deploy/shipped_pages.json'
          pages = json.load(open(f)) if os.path.exists(f) else []
          allowed = set()
          for p in pages:
              allowed.add(f'docs/{p}/index.html')
          # Always-allowed infrastructure files
          for f in ['docs/sitemap.xml', 'docs/sitemap-fixed.xml', 'docs/sitemap-all.xml',
                     'docs/admin/data.json']:
              allowed.add(f)
          # Price-driven and monthly SEO pages (update daily, safe to auto-deploy)
          for pattern in ['docs/prissankt/index.html', 'docs/prissankt-vin/index.html',
                          'docs/billigt-och-bra-vin/index.html']:
              allowed.add(pattern)
          # Monthly pages (basta-vin-{month}-{year}, generated by generate_monthly_seo.py)
          for d in glob.glob('docs/basta-vin-*-202*/'):
              allowed.add(os.path.join(d, 'index.html'))
          print('\n'.join(sorted(allowed)))
          ")

          # Check every staged docs/ file against the allowed list
          BLOCKED=""
          for f in $(git diff --cached --name-only -- docs/); do
            # Skip non-file entries and always-allowed patterns
            case "$f" in
              docs/admin/*) continue ;;
            esac
            if ! echo "$SHIPPED" | grep -qxF "$f"; then
              BLOCKED="$BLOCKED $f"
            fi
          done

          if [ -n "$BLOCKED" ]; then
            echo "ABORT: These files are not in the shipped manifest and cannot be committed:"
            for f in $BLOCKED; do echo "  $f"; done
            echo ""
            echo "To deploy docs/index.html or docs/wines*.json, add them to a deliberate SPA batch."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHANGED_PAGES=$(git diff --cached --name-only -- 'docs/*/index.html' | wc -l)
            echo "Pages changed: $CHANGED_PAGES"
            git commit -m "data: daily price update $(date '+%Y-%m-%d')"
            git push
          fi
