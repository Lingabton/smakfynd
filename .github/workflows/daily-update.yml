name: Daily wine data update

on:
  schedule:
    # Every day at 06:00 UTC (08:00 Swedish time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests rapidfuzz google-auth google-api-python-client

      - name: Set up Node.js (for Babel)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: |
          cd $GITHUB_WORKSPACE
          npm install --save-dev @babel/cli @babel/core @babel/preset-react

      - name: Create data directories
        run: |
          mkdir -p data/history data/logs

      - name: Download existing data (if cached)
        uses: actions/cache@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
          key: wine-data-${{ github.run_number }}
          restore-keys: |
            wine-data-

      - name: Fetch Systembolaget data
        id: fetch
        timeout-minutes: 45
        run: |
          python3 scripts/fetch_systembolaget.py

      - name: Score wines
        run: |
          python3 scripts/score_wines_v2.py

      - name: Build site
        run: |
          python3 scripts/build_slim.py
          python3 scripts/deploy_html.py

      # Re-baselines the corpus lock when drift is explained by SB delistings.
      # Must run before page generation: pages render the locked count.
      - name: Corpus lock
        run: |
          python3 scripts/corpus_lock.py

      - name: Generate landing pages + price drops
        run: |
          # Only regenerate pages that have shipped in a batch
          ALLOWLIST=$(python3 -c "import json,os; f='data/deploy/shipped_pages.json'; print(','.join(json.load(open(f))) if os.path.exists(f) else '')")
          if [ -n "$ALLOWLIST" ]; then
            DEPLOY_PAGES="$ALLOWLIST" python3 scripts/generate_landing_pages.py
          else
            echo "No shipped pages — skipping landing page generation"
          fi
          python3 scripts/generate_monthly_seo.py
          python3 scripts/generate_prissankt.py

      - name: Validate data
        run: |
          python3 scripts/validate_data.py

      - name: Fetch GSC data
        run: |
          if [ -z "$GSC_CREDS" ]; then
            echo "ERROR: GSC_CREDENTIALS_JSON secret is not set."
            echo "Go to repo Settings > Secrets > Actions and add it."
            echo "The health digest will flag this as RED."
          else
            echo "$GSC_CREDS" > /tmp/gsc_creds.json
            GSC_CREDENTIALS_JSON=/tmp/gsc_creds.json python3 scripts/fetch_gsc.py
            rm -f /tmp/gsc_creds.json
          fi
        env:
          GSC_CREDS: ${{ secrets.GSC_CREDENTIALS_JSON }}

      - name: Build admin data
        run: |
          python3 scripts/build_admin.py

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
          key: wine-data-${{ github.run_number }}

      - name: Commit and push
        run: |
          git config user.name "Smakfynd Bot"
          git config user.email "bot@smakfynd.se"
          # Stage only allowed docs/ files, never docs/index.html or docs/wines*.json
          git add site/ data/history/ data/prissankt_bootstrap.json data/gsc_history.json data/page_hashes.json data/deploy/corpus_lock.json
          # Stage shipped landing pages
          ALLOWLIST=$(python3 -c "import json,os; f='data/deploy/shipped_pages.json'; print(' '.join(f'docs/{p}/index.html' for p in json.load(open(f)))) if os.path.exists(f) else ''")
          for f in $ALLOWLIST; do [ -f "$f" ] && git add "$f"; done
          # Stage always-allowed docs files
          # CONTAINMENT: prissankt removed from allowlist until rebuilt from observed snapshots
          for f in docs/sitemap.xml docs/sitemap-fixed.xml docs/sitemap-all.xml docs/admin/data.json \
                   docs/billigt-och-bra-vin/index.html; do
            [ -f "$f" ] && git add "$f"
          done
          # Stage monthly pages
          for f in docs/basta-vin-*-202*/index.html; do [ -f "$f" ] && git add "$f"; done

          # Manifest check: verify nothing unexpected slipped through
          SHIPPED=$(python3 -c "
          import json, os, glob
          f = 'data/deploy/shipped_pages.json'
          pages = json.load(open(f)) if os.path.exists(f) else []
          allowed = set()
          for p in pages:
              allowed.add(f'docs/{p}/index.html')
          for f in ['docs/sitemap.xml', 'docs/sitemap-fixed.xml', 'docs/sitemap-all.xml',
                     'docs/admin/data.json']:
              allowed.add(f)
          # CONTAINMENT: prissankt removed until rebuilt from observed snapshots
          for pattern in ['docs/billigt-och-bra-vin/index.html']:
              allowed.add(pattern)
          for d in glob.glob('docs/basta-vin-*-202*/'):
              allowed.add(os.path.join(d, 'index.html'))
          print('\n'.join(sorted(allowed)))
          ")

          BLOCKED=""
          for f in $(git diff --cached --name-only -- docs/); do
            case "$f" in
              docs/admin/*) continue ;;
            esac
            if ! echo "$SHIPPED" | grep -qxF "$f"; then
              BLOCKED="$BLOCKED $f"
            fi
          done

          if [ -n "$BLOCKED" ]; then
            echo "ABORT: These files are not in the shipped manifest and cannot be committed:"
            for f in $BLOCKED; do echo "  $f"; done
            echo ""
            echo "To deploy docs/index.html or docs/wines*.json, add them to a deliberate SPA batch."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHANGED_PAGES=$(git diff --cached --name-only -- 'docs/*/index.html' | wc -l)
            echo "Pages changed: $CHANGED_PAGES"
            git commit -m "data: daily price update $(date '+%Y-%m-%d')" -m "Corpus lock: $(cat data/deploy/corpus_lock_report.txt 2>/dev/null)"
            git push
          fi

      # A failed validation used to drop the day's snapshot, leaving holes in the
      # price history that /prissankt/ is built from (Nov 2-24 2026 were lost).
      # Save only the raw observations; never pages or SPA data.
      - name: Preserve price history (on failure)
        if: failure() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "Smakfynd Bot"
          git config user.email "bot@smakfynd.se"
          git reset -q
          git add data/history/prices_*.json.gz data/history/deltas_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new history to preserve"
          else
            git commit -m "data: preserve price history $(date '+%Y-%m-%d') (build failed)"
            git pull --rebase
            git push
          fi

      # always(): the digest must run when the build fails, or failures go unreported.
      - name: Health digest (alerts on RED)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          python3 scripts/health_digest.py
