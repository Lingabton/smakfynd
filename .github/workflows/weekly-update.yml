name: Weekly Data Update & Deploy

# Runs every Monday at 06:00 UTC — fresh data for the week
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: npm ci

      - name: Install Python dependencies
        run: pip install requests rapidfuzz

      - name: Restore data caches
        uses: actions/cache@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
            data/history/first_seen_prices.json
            data/prissankt_bootstrap.json
          key: wine-data-${{ github.run_number }}
          restore-keys: |
            wine-data-

      - name: Create data directories
        run: mkdir -p data/history data/logs

      - name: Fetch Systembolaget data
        run: python3 scripts/fetch_systembolaget.py

      - name: Score wines
        run: python3 scripts/score_wines_v2.py

      - name: Build site
        run: |
          python3 scripts/build_app.py
          python3 scripts/build_slim.py
          python3 scripts/deploy_html.py
          # Only regenerate pages that have shipped in a batch
          ALLOWLIST=$(python3 -c "import json,os; f='data/deploy/shipped_pages.json'; print(','.join(json.load(open(f))) if os.path.exists(f) else '')")
          if [ -n "$ALLOWLIST" ]; then
            DEPLOY_PAGES="$ALLOWLIST" python3 scripts/generate_landing_pages.py
          else
            echo "No shipped pages — skipping landing page generation"
          fi

      - name: Validate
        run: |
          python3 scripts/validate_data.py
          python3 scripts/verify_determinism.py
          python3 scripts/health_digest.py
          node tests/test_scoring.js
          node tests/test_data.js

      - name: Other tasks
        run: |
          python3 scripts/snapshot_prices.py || echo "No price snapshot (missing data)"
          python3 scripts/gabriels_val.py || echo "Gabriels val skipped"

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/vivino_cache.json
            data/expert_cache.json
            data/history/first_seen_prices.json
            data/prissankt_bootstrap.json
          key: wine-data-${{ github.run_number }}

      - name: Commit & push if changed
        run: |
          git config user.name "Smakfynd Bot"
          git config user.email "bot@smakfynd.se"
          git add docs/ site/

          # Manifest check: only allow shipped pages + infrastructure
          SHIPPED=$(python3 -c "
          import json, os
          f = 'data/deploy/shipped_pages.json'
          pages = json.load(open(f)) if os.path.exists(f) else []
          allowed = set()
          for p in pages:
              allowed.add(f'docs/{p}/index.html')
          for f in ['docs/sitemap.xml', 'docs/sitemap-fixed.xml', 'docs/sitemap-all.xml',
                     'docs/admin/data.json']:
              allowed.add(f)
          print('\n'.join(sorted(allowed)))
          ")

          BLOCKED=""
          for f in $(git diff --staged --name-only -- docs/); do
            case "$f" in
              docs/admin/*) continue ;;
            esac
            if ! echo "$SHIPPED" | grep -qxF "$f"; then
              BLOCKED="$BLOCKED $f"
            fi
          done

          if [ -n "$BLOCKED" ]; then
            echo "ABORT: Unshipped files staged:"
            for f in $BLOCKED; do echo "  $f"; done
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            CHANGED_PAGES=$(git diff --staged --name-only -- 'docs/*/index.html' | wc -l)
            echo "Pages changed: $CHANGED_PAGES"
            git commit -m "Weekly update: fresh scores & landing pages [auto]"
            git push
          fi
