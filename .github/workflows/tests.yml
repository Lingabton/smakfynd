name: Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest rapidfuzz

      - name: Run tests
        run: python3 -m pytest tests/test_scoring.py -v
